<header class="app-header">
  <h1 class="app-header__title">{{ ui.appTitle }}</h1>
  <p class="app-header__tagline">{{ ui.appTagline }}</p>
</header>

<main class="app-main">
  <app-text-analyzer-page />
</main>

<footer class="app-footer">
  <p class="app-footer__line">
    <span>{{ ui.footer.dataSource }} <a [href]="datamuseUrl">{{ ui.footer.datamuse }}</a></span>
    <span class="app-footer__separator" aria-hidden="true">·</span>
    <a [href]="sourceCodeUrl">{{ ui.footer.sourceCode }}</a>
  </p>
</footer>
