<header class="app-header">
  <h1 class="app-header__title">{{ text.appTitle }}</h1>
  <p class="app-header__tagline">{{ text.appTagline }}</p>
</header>

<main class="app-main">
  <app-text-analyzer-page />
</main>

<footer class="app-footer">
  <p class="app-footer__line">
    <span>{{ text.footer.dataSource }} <a [href]="datamuseUrl">{{ text.footer.datamuse }}</a></span>
    <span class="app-footer__separator" aria-hidden="true">·</span>
    <a [href]="sourceCodeUrl">{{ text.footer.sourceCode }}</a>
  </p>
</footer>
